name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # El lockfile se genera en local con npm 11, que omite los peers
      # opcionales de typescript; el npm 10 que trae Node 20 los exige y
      # rechaza el lock en `npm ci`.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run build
